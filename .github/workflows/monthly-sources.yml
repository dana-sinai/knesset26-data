# Monthly: refresh the slower-changing sources that the daily update does not download.
#  - Wikipedia / Wikidata details of each MK (birth date and place, education, occupation, residence) -> pipeline/work/wikidata.json
# The next daily update rebuilds the site data with it. (Judgement work — error reports, new roles, bills the model was
# unsure about — is done by a monthly Claude task; see pipeline/MONTHLY.md.)
name: monthly-sources
on:
  schedule:
    - cron: "41 2 1 * *"   # 1st of the month, 04:41/05:41 Israel
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Refresh Wikipedia / Wikidata details
        run: |
          mkdir -p pipeline/raw/wiki
          python3 pipeline/04_wikidata_enrich.py | tail -5
      - name: Save
        run: |
          git config user.name "monthly-sources bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/work/wikidata.json
          if git diff --cached --quiet; then echo "::notice::no changes in Wikidata"; exit 0; fi
          echo "::notice::$(git diff --cached --stat | tail -1)"
          git commit -m "Monthly: Wikidata refresh $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done
